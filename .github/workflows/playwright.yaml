name: Playwright Tests
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  # Allow updating snapshots during manual runs
  workflow_call:
    inputs:
      update-snapshots:
        description: "Update snapshots?"
        type: boolean

  # Allow updating snapshots during automatic runs
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: "Update snapshots?"
        type: boolean

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install -g pnpm && pnpm install

      - name: Install Playwright browsers
        working-directory: ./sites/web
        run: pnpm exec playwright install --with-deps

      - name: Set up cache
        id: cache
        uses: actions/cache@v4
        with:
          key: cache/${{github.repository}}/${{github.ref}}
          restore-keys: cache/${{github.repository}}/refs/heads/master
          path: ./sites/web/test/**

      - name: Initialise snapshots
        working-directory: ./sites/web
        if: ${{steps.cache.outputs.cache-hit != 'true' || inputs.update-snapshots == 'true'}}
        run: pnpm exec playwright test --update-snapshots

      - name: Wait for Netlify deploy preview
        uses: jakepartusch/wait-for-netlify-action@v1.2
        id: netlify-deploy-preview
        with:
          site_name: 'typonline'
          max_timeout: 360 # 6 Minutes, depends on your build pipeline duration

      - name: Run Playwright tests
        working-directory: ./sites/web
        run: pnpm exec playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.netlify-deploy-preview.outputs.url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: sites/web/playwright-report/
          retention-days: 30
